spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  quartz:
    job-store-type: memory
    auto-startup: false

aiw:
  auth:
    rate-limit-per-minute: 20
  limits:
    max-graph-nodes: 500
  jwt:
    secret: development-only-jwt-secret-must-be-at-least-32-bytes
  refresh:
    hash-secret: development-only-refresh-hash-secret
    cookie-secure: false
  contracts:
    root: ${user.dir}/../../contracts
  credentials:
    kek: development-only-credential-kek-must-be-32b
  service-jwt:
    secret: development-only-jwt-secret-must-be-at-least-32-bytes
  messaging:
    enabled: false
  storage:
    enabled: false

management:
  health:
    rabbit:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
