services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aiw
      POSTGRES_USER: aiw
      POSTGRES_PASSWORD: aiw
    ports:
      - "5432:5432"
    volumes:
      - aiw-postgres:/var/lib/postgresql/data
      - ./services/execution-engine/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiw -d aiw"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aiw
      RABBITMQ_DEFAULT_PASS: aiw
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  control-plane:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aiw
      AIW_DATABASE_USERNAME: aiw
      AIW_DATABASE_PASSWORD: aiw
      AIW_JWT_SECRET: ${AIW_JWT_SECRET:-development-only-jwt-secret-must-be-at-least-32-bytes}
      AIW_REFRESH_HASH_SECRET: ${AIW_REFRESH_HASH_SECRET:-development-only-refresh-hash-secret}
      AIW_REFRESH_COOKIE_SECURE: ${AIW_REFRESH_COOKIE_SECURE:-false}
      AIW_CONTRACTS_ROOT: /contracts
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  execution-worker:
    build:
      context: ./services/execution-engine
    environment:
      AIW_DATABASE_URL: postgresql://aiw:aiw@postgres:5432/aiw
      AIW_RABBITMQ_URL: amqp://aiw:aiw@rabbitmq:5672/
      AIW_SERVICE_ROLE: execution-worker
      AIW_CONTRACTS_ROOT: /contracts
      AIW_FAKE_LLM: ${AIW_FAKE_LLM:-false}
      AIW_FAKE_IMAGE: ${AIW_FAKE_IMAGE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AIW_OPENAI_BASE_URL: ${AIW_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AIW_OPENAI_MODEL: ${AIW_OPENAI_MODEL:-gpt-4o-mini}
      AIW_DEEPSEEK_API_KEY: ${AIW_DEEPSEEK_API_KEY:-${ZENMUX_API_KEY:-}}
      ZENMUX_API_KEY: ${ZENMUX_API_KEY:-}
      ZENMUSK_API_KEY: ${ZENMUSK_API_KEY:-}
      AIW_DEEPSEEK_BASE_URL: ${AIW_DEEPSEEK_BASE_URL:-https://zenmux.ai/api/v1}
      AIW_DEEPSEEK_MODEL: ${AIW_DEEPSEEK_MODEL:-deepseek/deepseek-v4-pro}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AIW_GEMINI_TEXT_MODEL: ${AIW_GEMINI_TEXT_MODEL:-gemini-3.5-flash}
      AIW_IMAGE_PROVIDER: ${AIW_IMAGE_PROVIDER:-zenmusk}
      AIW_GOOGLE_IMAGE_MODEL: ${AIW_GOOGLE_IMAGE_MODEL:-gemini-3.1-flash-lite-image}
      AIW_OPENAI_IMAGE_MODEL: ${AIW_OPENAI_IMAGE_MODEL:-gpt-image-1}
      AIW_ZENMUSK_IMAGE_MODEL: ${AIW_ZENMUSK_IMAGE_MODEL:-google/gemini-3.1-flash-image}
      AIW_ZENMUSK_IMAGE_BASE_URL: ${AIW_ZENMUSK_IMAGE_BASE_URL:-https://zenmux.ai/api/vertex-ai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AIW_ANTHROPIC_MODEL: ${AIW_ANTHROPIC_MODEL:-claude-sonnet-4-5}
      AIW_ARTIFACT_DIR: /app/artifacts
    volumes:
      - ./services/execution-engine/src:/app/src:ro
      - ./services/execution-engine/sql:/app/sql:ro
      - ./contracts:/contracts:ro
      - ./services/execution-engine/artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "ai_workflow.worker.execution_worker"]

  task-worker:
    build:
      context: ./services/execution-engine
    environment:
      AIW_DATABASE_URL: postgresql://aiw:aiw@postgres:5432/aiw
      AIW_RABBITMQ_URL: amqp://aiw:aiw@rabbitmq:5672/
      AIW_SERVICE_ROLE: task-worker
      AIW_CONTRACTS_ROOT: /contracts
      AIW_FAKE_LLM: ${AIW_FAKE_LLM:-true}
      AIW_ARTIFACT_DIR: /app/artifacts
    volumes:
      - ./services/execution-engine/src:/app/src:ro
      - ./services/execution-engine/sql:/app/sql:ro
      - ./contracts:/contracts:ro
      - ./services/execution-engine/artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "ai_workflow.worker.task_worker"]

  execution-api:
    build:
      context: ./services/execution-engine
    environment:
      AIW_DATABASE_URL: postgresql://aiw:aiw@postgres:5432/aiw
      AIW_RABBITMQ_URL: amqp://aiw:aiw@rabbitmq:5672/
      AIW_SERVICE_ROLE: execution-api
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["uvicorn", "ai_workflow.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]

  rag-worker:
    build:
      context: ./services/rag
    environment:
      AIW_DATABASE_URL: postgresql://aiw:aiw@postgres:5432/aiw
      AIW_RABBITMQ_URL: amqp://aiw:aiw@rabbitmq:5672/
      AIW_SERVICE_ROLE: rag-worker
      AIW_CONTRACTS_ROOT: /contracts
      AIW_FAKE_EMBEDDINGS: ${AIW_FAKE_EMBEDDINGS:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AIW_OPENAI_BASE_URL: ${AIW_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AIW_EMBEDDING_MODEL: ${AIW_EMBEDDING_MODEL:-text-embedding-3-small}
      AIW_CONTROL_PLANE_INTERNAL_URL: ${AIW_CONTROL_PLANE_INTERNAL_URL:-}
      AIW_INTERNAL_AUTH_TOKEN: ${AIW_INTERNAL_AUTH_TOKEN:-}
    volumes:
      - ./services/rag/src:/app/src:ro
      - ./services/rag/sql:/app/sql:ro
      - ./contracts:/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "ai_workflow_rag.worker.ingestion_worker"]

  rag-api:
    build:
      context: ./services/rag
    environment:
      AIW_DATABASE_URL: postgresql://aiw:aiw@postgres:5432/aiw
      AIW_RABBITMQ_URL: amqp://aiw:aiw@rabbitmq:5672/
      AIW_SERVICE_ROLE: rag-api
    ports:
      - "8089:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["uvicorn", "ai_workflow_rag.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]

volumes:
  aiw-postgres:
